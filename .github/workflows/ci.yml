name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dart-core-tests:
    name: Protocol, Crypto & Multi-Node Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve Dependencies
        run: |
          for dir in packages/models packages/crypto packages/protocol packages/validation packages/shared tests; do
            echo "Resolving dependencies in $dir..."
            dart pub get --directory=$dir
          done

      - name: Run Dart Unit & Security Tests
        run: |
          dart run tests/protocol_test.dart
          dart run tests/crypto_test.dart
          dart run tests/store_and_forward_test.dart

      - name: Run 10-Node & 50-Node Mesh Simulation
        run: |
          dart run tests/mesh_simulation.dart --nodes=10
          dart run tests/mesh_simulation.dart --nodes=50

  backend-command-center:
    name: Command Center & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Test Command Center
        run: |
          cd apps/command-center
          npm install --no-audit
          npm test

      - name: Install & Test Backend API
        run: |
          cd backend
          npm install --no-audit
          npm test

  static-analysis:
    name: Static Analysis & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve Dependencies
        run: |
          for dir in packages/models packages/crypto packages/protocol packages/validation packages/shared; do
            echo "Resolving dependencies in $dir..."
            dart pub get --directory=$dir
          done

      - name: Analyze Core Packages
        run: |
          dart analyze packages/models
          dart analyze packages/crypto
          dart analyze packages/protocol
          dart analyze packages/validation
          dart analyze packages/shared
