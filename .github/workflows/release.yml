name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-package:
    name: Build Multiplatform Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Verify Package Integrity
        run: |
          dart pub get --directory=packages/protocol
          dart pub get --directory=packages/crypto

      - name: Generate Release Assets
        run: |
          mkdir -p release-artifacts
          tar -czf release-artifacts/emergixx-protocol-v1.tar.gz packages/protocol packages/crypto packages/models

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
