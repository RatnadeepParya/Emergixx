name: "Feature Request"
description: "Suggest an enhancement or new feature for Emergixx"
title: "[FEATURE]: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Emergixx prioritizes resilience, offline capability, battery conservation, and zero-trust security. Proposed features must align with the local-first emergency paradigm.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What operational gap or user need does this feature solve during an emergency?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the technical implementation, UX workflow, and impact on battery/network.
    validations:
      required: true
  - type: dropdown
    id: offline_impact
    attributes:
      label: Offline & Mesh Impact
      description: Can this feature function when all cellular and internet networks are unavailable?
      options:
        - "Yes: Fully functional completely offline via P2P mesh"
        - "Yes: Local-first with optional cloud synchronization when online"
        - "No: Cloud command-center / Administrative feature only"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Considerations
      description: What alternative approaches did you evaluate?
